<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PingAsk</title>
    <meta name="description" content="Quick ask, quick search, quick answer at the speed of light.">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.7/dist/cdn.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }

        :root {
            --background: #ccc;
            --foreground: #000;
            --border-color: #bababa6c;
            --border-radius-sm: 8px;
            --border-radius-md: 12px;
            --border-radius-lg: 16px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #111;
                --foreground: #fff;
                --border-color: #44444476;
            }
        }

        body {
            color: var(--foreground);
            background-color: var(--background);
        }

        #root {
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 620px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            height: 90vh;
        }

        .user_profile {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .user_profile img {
            width: 32px;
            height: 32px;
            border-radius: 100%;
            object-fit: cover;
        }

        .user_profile span {
            font-size: 1.1rem;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 1rem;
        }

        .message {
            display: flex;
            max-width: 80%;
        }

        .message-user {
            align-self: flex-end;
        }

        .message-assistant {
            align-self: flex-start;
        }

        .message-content {
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius-md);
            background-color: var(--border-color);
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message-user .message-content {
            background-color: var(--foreground);
            color: var(--background);
        }

        .chat_input {
            display: flex;
            gap: 0.5rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border-color);
            margin-top: 5rem;
        }

        .chat_input input {
            flex: 1;
            padding: 0.75rem 0;
            border: none;
            background: transparent;
            color: var(--foreground);
            font-size: 1.25rem;
            outline: none;
        }

        .chat_input button {
            border: none;
            background: transparent;
            color: var(--foreground);
            cursor: pointer;
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <div id="root" x-data="chatStream()">
        <div class="container">
            <div class="header">
                <div class="user_profile">
                    <img src="https://tanlethanh.me/assets/goku.webp" alt="Tan Le" />
                    <span safe>Tan Le</span>
                </div>
            </div>

            <form class="chat_input" @submit.prevent="askQuestion">
                <input type="text" x-model="question" :disabled="isLoading" placeholder="Ask a question..." autofocus>
                <button type="submit" :disabled="isLoading || !question.trim()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 4v7a4 4 0 0 1-4 4H4" />
                        <path d="m9 10-5 5 5 5" />
                    </svg>
                </button>
            </form>

            <!-- <div class="messages">
                <template x-for="message in messages" :key="message.id">
                    <div :class="'message message-' + message.role">
                        <div class="message-content" x-text="message.text"></div>
                    </div>
                </template>
            </div> -->

            </di>
        </div>
</body>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('chatStream', () => ({
            messages: [],
            question: "",
            isLoading: false,
            async askQuestion() {
                if (!this.question.trim()) return;

                this.messages.push({ id: Date.now(), role: "user", text: this.question });

                const q = this.question;
                this.question = "";
                this.isLoading = true;

                const msgIndex = this.messages.length;
                this.messages.push({ id: Date.now() + 1, role: "assistant", text: "" });

                try {
                    const response = await fetch("/api/ask?question=" + encodeURIComponent(q));
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = "";

                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split("\n");
                        buffer = lines.pop();

                        for (const line of lines.filter(l => l.trim())) {
                            const data = JSON.parse(line);
                            if (data.type === "content") {
                                this.messages[msgIndex] = {
                                    ...this.messages[msgIndex],
                                    text: this.messages[msgIndex].text + data.delta
                                };
                            }
                        }
                    }
                } catch (err) {
                    this.messages[msgIndex] = {
                        ...this.messages[msgIndex],
                        text: "Error: " + err.message
                    };
                }

                this.isLoading = false;
            }
        }));
    });
</script>

</html>
