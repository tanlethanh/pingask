[package]
name = "pingask"
version = "0.1.0"
description = "Quick ask, quick answer at the speed of light."
authors = ["Tan Le"]
edition = "2021"

[lib]
name = "pingask_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
# Required by tauri::generate_context!, which serializes the plugin config block.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tauri-plugin-opener = "2.5.5"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-store = "2.4.4"
# `unsafe-headers` lifts the fetch-spec forbidden-header list, which is what lets
# core/net/origin.ts send an empty Origin — the plugin's documented way of removing the
# header. Without it the plugin drops our value and appends the webview's origin instead.
tauri-plugin-http = { version = "2.6.0", features = ["unsafe-headers"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-oauth = "2.1.0"
tauri-plugin-dialog = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.11.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
