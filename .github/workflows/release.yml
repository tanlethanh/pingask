name: Release

# Push a tag to ship:
#   bun run version 0.2.0
#   git commit -am "release: 0.2.0" && git tag -a v0.2.0 -m "v0.2.0" && git push --follow-tags
#
# Secrets this needs are listed in docs/release.md. Run the workflow manually
# (workflow_dispatch) to build a signed bundle without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: '1.4.1'

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Tag matches the source version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          source="$(bun run --silent version)"
          if [ "$tag" != "$source" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match source version $source — run 'bun run version $tag'"
            exit 1
          fi

      - run: bun run check

      - run: bun test

  build:
    name: build, sign, publish
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Updater signing key present
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is unset. createUpdaterArtifacts is on, so the build cannot produce a signed update."
            exit 1
          fi

      # Two jobs at once: `secrets` is not readable from a step `if:`, so credential
      # presence becomes step outputs the steps below can read; and notarization
      # wants the App Store Connect key as a file, so the .p8 secret is written to
      # the runner's temp dir and its path exported for the build.
      - name: Apple credentials present
        id: apple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          signed=false
          notarized=false
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE is unset — the bundle will be unsigned and Gatekeeper will block it on other machines."
          else
            signed=true
            if [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY_P8" ]; then
              echo "::warning::App Store Connect API key incomplete — the bundle will be signed but not notarized."
            else
              key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
              printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
              chmod 600 "$key_path"
              echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
              notarized=true
            fi
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "notarized=$notarized" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          # Updater manifest signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Code signing. The bundler imports the .p12 into a throwaway keychain itself.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Notarization via an App Store Connect API key. APPLE_API_KEY_PATH is
          # exported by the credentials step above.
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Empty on workflow_dispatch, which builds without touching releases.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: PingAsk ${{ github.ref_name }}
          releaseBody: |
            Download the universal `.dmg` below — macOS 11 or newer, Apple silicon and Intel.

            Installed copies update themselves: this release publishes `latest.json` for the in-app updater.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generateReleaseNotes: true
          uploadWorkflowArtifacts: true
          # One universal bundle. tauri-action writes both darwin-aarch64 and
          # darwin-x86_64 entries into latest.json for it.
          args: --target universal-apple-darwin

      - name: Verify signature
        if: steps.apple.outputs.signed == 'true'
        env:
          APP: src-tauri/target/universal-apple-darwin/release/bundle/macos/PingAsk.app
        run: |
          codesign -dv --verbose=4 "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      # spctl must say "accepted / Notarized Developer ID"; stapler proves the
      # ticket travelled with the bundle, so a fresh machine opens it offline.
      - name: Verify notarization
        if: steps.apple.outputs.notarized == 'true'
        env:
          APP: src-tauri/target/universal-apple-darwin/release/bundle/macos/PingAsk.app
        run: |
          spctl -a -vvv -t install "$APP"
          xcrun stapler validate "$APP"

      - name: Remove the API key
        if: always() && env.APPLE_API_KEY_PATH != ''
        run: rm -f "$APPLE_API_KEY_PATH"
